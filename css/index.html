<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra de Pesquisa</title>
    <style>
        body {
            background-color: black;
            color: white;
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .search-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .search-bar-container {
            display: flex;
            align-items: center;
            margin-top: 20px;
        }
        .search-bar {
            padding: 10px;
            width: 300px;
            border-radius: 5px 0 0 5px;
            border: none;
            outline: none;
        }
        .search-button {
            padding: 10px;
            background-color: #1e90ff;
            border: none;
            border-radius: 0 5px 5px 0;
            color: white;
            cursor: pointer;
        }
        .search-button:hover {
            background-color: #0073e6;
        }
        .signup {
            position: absolute;
            top: 10px;
            right: 20px;
            color: white;
            text-decoration: none;
        }
        .signup:hover {
            text-decoration: underline;
        }
        .toxic-button {
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #00FF00;
            color: black;
            border: 2px solid #00FF00;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            text-shadow: 0 0 5px #00FF00, 0 0 10px #00FF00;
            animation: flicker 1.5s infinite alternate;
        }

        .toxic-button:hover {
            background-color: black;
            color: #00FF00;
        }

        @keyframes flicker {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <a href="#" class="signup">Cadastro</a>
    <div class="search-container">
        <h1>Meu Primeiro Site</h1>
        <div class="search-bar-container">
            <input type="text" class="search-bar" placeholder="Pesquise aqui...">
            <button class="search-button">Buscar</button>
        </div>
        <button class="toxic-button">Botão Tóxico</button>
    </div>
</body>
</html>
