<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Game</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      margin-top: 30px;
      font-family: sans-serif;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(8, 60px);
      grid-template-rows: repeat(8, 60px);
      border: 2px solid #333;
    }

    .cell {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      cursor: pointer;
      user-select: none;
    }

    .white {
      background-color: #eee;
    }

    .black {
      background-color: #444;
      color: white;
    }

    .selected {
      outline: 3px solid red;
    }
  </style>
</head>
<body>
  <div class="board" id="board"></div>

  <script>
    const pieces = {
      r: '♜', n: '♞', b: '♝', q: '♛', k: '♚', p: '♟',
      R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔', P: '♙'
    };

    const initialPosition = [
      ['r','n','b','q','k','b','n','r'],
      ['p','p','p','p','p','p','p','p'],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['','','','','','','',''],
      ['P','P','P','P','P','P','P','P'],
      ['R','N','B','Q','K','B','N','R']
    ];

    const board = document.getElementById('board');
    let selected = null;

    function createBoard() {
      board.innerHTML = '';
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const cell = document.createElement('div');
          cell.className = 'cell ' + ((row + col) % 2 === 0 ? 'white' : 'black');
          cell.dataset.row = row;
          cell.dataset.col = col;
          const piece = initialPosition[row][col];
          if (piece) {
            cell.textContent = pieces[piece];
          }
          cell.addEventListener('click', handleClick);
          board.appendChild(cell);
        }
      }
    }

    function handleClick(e) {
      const cell = e.currentTarget;
      const row = cell.dataset.row;
      const col = cell.dataset.col;

      if (selected) {
        const fromRow = selected.dataset.row;
        const fromCol = selected.dataset.col;
        const piece = initialPosition[fromRow][fromCol];

        initialPosition[fromRow][fromCol] = '';
        initialPosition[row][col] = piece;
        selected.classList.remove('selected');
        selected = null;
        createBoard();
      } else if (cell.textContent) {
        selected = cell;
        cell.classList.add('selected');
      }
    }

    createBoard();
  </script>
</body>
</html>
